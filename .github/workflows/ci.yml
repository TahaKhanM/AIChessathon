name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install uv==0.11.2
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m pytest tests -q
      - run: uv run python -m build
      - name: Check installed wheel without checkout imports
        run: |
          python -m venv /tmp/chess-wheel
          /tmp/chess-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/chess-wheel/bin/python -c "import agent, chess; from engine.clock_b.horizon import estimated_moves_to_go; assert estimated_moves_to_go(0) == 38; b = chess.Board(); assert chess.Move.from_uci(agent.get_move(b.fen(), 0)) in b.legal_moves"
      - run: uv run python -m bench.run --depth 3 --repeats 3 --output bench/results/ci.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark
          path: bench/results/ci.json
